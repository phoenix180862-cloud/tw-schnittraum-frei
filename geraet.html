<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="tw-version" content="1.6.0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerät prüfen – TW Schnittraum</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1923">
<script type="importmap">{ "imports": { "mediabunny": "./lib/mediabunny.min.mjs" } }</script>
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="stylesheet" href="schriften/schriften.css">
<link rel="stylesheet" href="css/sr.css?v=1.6.0">
<style>
  html, body { overflow: auto; height: auto; min-height: 100%; } body { display: block; }
  .seite { max-width: 760px; margin: 0 auto; padding: 14px 14px 60px; }
  .kopfzeile { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .kopfzeile h1 { font-size: 24px; flex: 1; }
  #probeBild { max-width: 150px; max-height: 150px; border-radius: 6px; border: 1px solid var(--line); display: block; margin-top: 6px; }
</style>
<script>(function(){try{var t=localStorage.getItem("twsr.thema");if(t)document.documentElement.dataset.thema=t;}catch(e){}})();</script>
<script src="frei-config.js?v=1.6.0"></script>
<script defer src="lib/tw-version.js?v=1.6.0"></script>
</head>
<body>
<div class="seite">
  <div class="kopfzeile">
    <span class="logo-schild" title="Thomas Willwacher Fliesenlegermeister e.K."><img src="img/tw-logo-original.png" alt="Thomas Willwacher Fliesenlegermeister e.K." width="720" height="212"></span>
    <h1>Gerät prüfen</h1>
    <span class="sr-version" data-tw-version></span>
  </div>
  <p class="hinweis" style="font-size:14.5px">Diese Seite prüft in wenigen Sekunden, was dieses Gerät im TW Schnittraum kann – zum Beispiel, ob es die platzsparenden Handyvideos („hohe Effizienz“, HDR) lesen kann. Es wird dabei nichts hochgeladen.</p>
  <div class="zeile">
    <button class="btn primaer" id="gStart">↻ Noch einmal prüfen</button>
    <button class="btn" id="gSprache">Auch die Spracherkennung prüfen</button>
    <a class="btn" href="hilfe.html">Zur Hilfe</a>
  </div>
  <p class="hinweis" id="gStand" aria-live="polite">Prüfung läuft …</p>
  <ul class="pruef-liste" id="gListe"></ul>
  <p class="hinweis" id="gGeraet"></p>
</div>
<script type="module" src="js/geraet.js?v=1.6.0"></script>
</body>
</html>
